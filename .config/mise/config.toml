# The repository's one mise configuration (TOOL-01): every CLI that is not a
# devcontainer Feature. The Dockerfile bakes only mise itself; post-create runs
# `mise install --locked` against this file, and CI resolves the same pins via
# jdx/mise-action. Tier rules: CONFIGURATION.md → "Runtimes & Tools".
#
# Edit a version here, run `mise lock`, commit both files, then
# `task tools:install`. Backends are fully qualified so resolution does not
# depend on mise's registry.

# Keep in lockstep with ARG MISE_VERSION in .devcontainer/Dockerfile and the
# jdx/mise-action `version:` in .github/workflows/ (TOOL-04).
min_version = "2026.8.6"

[tools]
# --- Conventions ---------------------------------------------------------
"github:musher-dev/engineering-conventions" = "0.8.0"

# --- Toolchain (was baked in the Dockerfile) -------------------------------
# mise.lock records each download URL and checksum, so `install --locked`
# makes none of the GitHub API calls that rate-limited the Features.
"aqua:oven-sh/bun"     = "1.3.14"
"aqua:astral-sh/uv"    = "0.11.28"
"aqua:go-task/task"    = "3.52.0"

# --- AI + git hooks ------------------------------------------------------
"npm:@openai/codex" = "0.143.0"
# Keep in lockstep with min_version in .config/lefthook.yml (HOOKS-02).
"npm:lefthook"      = "2.1.10"
"github:crate-ci/committed" = "1.1.11"

# --- Linters (configs live in .config/; see .config/README.md) -----------
"npm:markdownlint-cli2"  = "0.22.1"
"pipx:yamllint"          = "1.38.0"
"pipx:codespell"         = "2.4.3"
"aqua:rhysd/actionlint"  = "1.7.12"
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:mikefarah/yq"      = "4.53.6"
