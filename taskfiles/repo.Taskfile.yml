version: '3'

# Repo-governance tasks. These wrap the `repo` CLI installed from .repo/
# by the devcontainer bootstrap (uv tool install ./.repo).
# See .repo/README.md for what each policy enforces and why; the general rules
# are engineering-conventions' (`task conventions`).

tasks:
  check:
    desc: Run the scaffold's own policies (layout, paths, env, ports, hooks, comments).
    cmds:
      - repo check

  check:ports:
    desc: Verify the port table, forwardPorts, and compose published ports agree.
    cmds:
      - repo ports check

  check:layout:
    desc: Verify dev container mounts and editor links agree with the declared product.
    cmds:
      - repo layout check

  check:paths:
    desc: Verify the .gitattributes, paths-filter and .claude/rules globs still match a file.
    cmds:
      - repo paths check

  check:env:
    desc: Verify the env schema and the compose stacks agree.
    cmds:
      - repo env check

  test:
    desc: Run the governance policies' pytest suite.
    cmds:
      - uv run --project .repo --group dev pytest .repo/tests

  check:hooks:
    desc: Verify every lefthook job has a CI counterpart and vice versa.
    cmds:
      - repo hooks check

  install:
    desc: (Re)install the `repo` CLI from .repo/ into the current environment.
    cmds:
      # --reinstall: uv reuses the cached build of an unchanged version otherwise,
      # so an edited policy would never take effect.
      - uv tool install --force --reinstall ./.repo
