# Dependabot keeps the dev container supply chain fresh.
# Docs: https://containers.dev/guide/dependabot
#
# - devcontainers  : bumps the Features in devcontainer.json AND refreshes
#                    devcontainer-lock.json (digest pins). Not the base
#                    `image` tag, and not the local mise Feature: bump those
#                    by hand.
# - github-actions : bumps the actions pinned in .github/workflows/.
# - docker         : bumps the image tags in the compose files.
#
# Titles are `chore(deps): ...`, which .config/commits/committed.toml accepts.
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  # A product's own ecosystem (cargo, npm, uv, gomod ...) scans the product
  # directory, never "/". See docs/layout.md → "Ecosystem Adapters".
  # - package-ecosystem: "cargo"
  #   directory: "/<product>"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker images: each stack's own standard-named compose.yaml, pulled into
  # stacks/compose.yaml via `include:`. The orchestrator itself declares no
  # images. If Dependabot does not surface PRs for a stack, verify detection
  # under Insights -> Dependency graph -> Dependabot and adjust these
  # directories.
  #
  # Note: this does NOT cover mise or the pins in .config/mise/config.toml --
  # Dependabot has no ecosystem for those. Bump them by hand and re-run
  # `mise lock`.
  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer/stacks/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
